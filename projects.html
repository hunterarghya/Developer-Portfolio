<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MISSIONS — ARGHYA MALAKAR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        :root {
            --c0: #000;
            --c1: #001000;
            --c2: #001010;
            --c3: #002010;
            --c4: #002020;
            --c5: #003030;
            --c6: #103020;
            --c7: #104040;
            --c8: #105050;
            --c9: #106060;
            --glow: #00ff99;
            --heading: var(--glow);
            --desc: hsl(168, 50%, 45%)
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            cursor: none
        }

        #cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            border: 1px solid var(--glow);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen
        }

        #cursor-dot {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--glow);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%)
        }

        #scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0, 0, 0, .07) 3px, rgba(0, 0, 0, .07) 4px);
            pointer-events: none;
            z-index: 100
        }

        #grid-bg {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--c1) 1px, transparent 1px), linear-gradient(90deg, var(--c1) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: .35;
            z-index: 0
        }

        #rain-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: .08
        }

        /* HEADER BG FOR MOBILE */
        #header-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 96px;
            background: #000;
            z-index: 40;
            display: none;
        }

        /* PAGE TITLE — top left like "VISION" */
        #page-title {
            position: fixed;
            top: 28px;
            left: 32px;
            font-family: 'VT323', monospace;
            font-size: 42px;
            color: var(--glow);
            letter-spacing: 10px;
            z-index: 50;
            pointer-events: none
        }

        #page-sub {
            position: fixed;
            top: 76px;
            left: 34px;
            font-size: 9px;
            color: var(--c8);
            letter-spacing: 3px;
            z-index: 50;
            pointer-events: none
        }

        /* DIVIDER LINE */
        #divider {
            position: fixed;
            top: 95px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--c5), var(--glow) 30%, var(--glow) 70%, var(--c5));
            opacity: .3;
            z-index: 50
        }

        /* LAYOUT */
        #app {
            position: fixed;
            top: 100px;
            left: 0;
            right: 0;
            bottom: 50px;
            display: flex;
            z-index: 10
        }

        /* LEFT PANEL — project list */
        #left-panel {
            width: 42%;
            border-right: 1px solid var(--c4);
            overflow-y: auto;
            padding: 10px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--c5) transparent
        }

        #left-panel::-webkit-scrollbar {
            width: 3px
        }

        #left-panel::-webkit-scrollbar-thumb {
            background: var(--c5)
        }

        .proj-item {
            padding: 11px 16px;
            background: rgba(0, 20, 15, 0.65);
            margin: 0 10px 8px 10px;
            border: 1px solid rgba(0, 255, 153, 0.15);
            border-left: 3px solid rgba(0, 255, 153, 0.3);
            cursor: pointer;
            transition: all .2s ease;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            border-radius: 3px;
            height: 78px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .proj-item:hover {
            background: rgba(0, 35, 20, 0.85);
            border-color: rgba(0, 255, 153, 0.4);
            border-left: 3px solid var(--glow);
            transform: translateX(3px);
        }

        .proj-item.active {
            background: rgba(0, 25, 15, 0.95);
            border: 1px solid var(--glow);
            border-left: 4px solid var(--glow);
            box-shadow: inset 0 0 20px rgba(0, 255, 153, 0.15), 0 0 15px rgba(0, 255, 153, 0.25);
            transform: translateX(4px);
        }

        .proj-title {
            font-size: 13.5px;
            color: #d0f5e0;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 4px;
            transition: all .2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 32px;
        }

        .proj-item:hover .proj-title {
            color: var(--glow);
        }

        .proj-item.active .proj-title {
            color: var(--glow);
            text-shadow: 0 0 8px var(--glow);
        }

        .proj-tag {
            font-size: 9.5px;
            color: var(--c8);
            letter-spacing: 0.8px;
            line-height: 1.35;
            transition: all .2s ease;
            padding-right: 32px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 26px;
        }

        .proj-item:hover .proj-tag {
            color: rgba(0, 255, 153, 0.7);
        }

        .proj-item.active .proj-tag {
            color: rgba(0, 255, 153, 0.9);
        }

        .proj-idx {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: var(--c6);
            transition: all .2s ease;
        }

        .proj-item:hover .proj-idx {
            color: var(--c8);
        }

        .proj-item.active .proj-idx {
            color: var(--glow);
            text-shadow: 0 0 8px var(--glow);
        }

        /* RIGHT PANEL */
        #right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        /* TAB BAR — like vision/hearing/motor tabs */
        #tab-bar {
            display: flex;
            border-bottom: 1px solid var(--c4);
            padding: 0 16px;
            flex-shrink: 0;
            min-height: 36px;
            align-items: stretch
        }

        .tab {
            padding: 8px 16px;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--c8);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all .15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .tab:hover {
            color: var(--glow)
        }

        .tab.active {
            color: var(--glow);
            border-bottom-color: var(--glow)
        }

        .tab svg {
            width: 14px;
            height: 14px;
            fill: currentColor
        }

        .tab.live-tab {
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        }

        .tab.live-tab:hover {
            color: #ff6666;
            text-shadow: 0 0 12px rgba(255, 102, 102, 0.8);
        }

        /* CONTENT AREA */
        #content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            scrollbar-width: thin;
            scrollbar-color: var(--c5) transparent
        }

        #content-area::-webkit-scrollbar {
            width: 3px
        }

        #content-area::-webkit-scrollbar-thumb {
            background: var(--c5)
        }

        .content-title {
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: var(--glow);
            letter-spacing: 4px;
            margin-bottom: 14px
        }

        .content-text {
            font-size: 11px;
            color: var(--desc);
            line-height: 1.9;
            letter-spacing: .5px;
            white-space: pre-wrap
        }

        .content-text b,
        .content-text strong {
            color: var(--glow);
            font-weight: normal
        }

        .content-text i,
        .content-text em {
            color: #8be0b2;
            font-style: italic
        }

        /* OVERVIEW WRAP & MEDIA FRAME */
        .overview-wrap {
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }

        .overview-text {
            flex: 1;
            min-width: 0;
        }

        /* MEDIA DISPLAY FRAME */
        .media-frame {
            position: relative;
            background: rgba(0, 16, 10, 0.65);
            border: 1px solid rgba(0, 255, 153, 0.28);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 255, 153, 0.08);
            transition: all 0.25s ease;
        }

        .media-frame:hover {
            border-color: var(--glow);
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.75), 0 0 20px rgba(0, 255, 153, 0.18);
        }

        .media-frame-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 12px;
            background: rgba(0, 26, 14, 0.88);
            border-bottom: 1px solid rgba(0, 255, 153, 0.18);
            font-family: 'Share Tech Mono', monospace;
            font-size: 8.5px;
            letter-spacing: 2px;
            color: var(--c8);
            user-select: none;
        }

        .media-frame-header .frame-tag {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .media-frame-header .frame-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--glow);
            box-shadow: 0 0 6px var(--glow);
            display: inline-block;
        }

        .media-frame-header .frame-action {
            color: var(--c7);
            font-size: 8px;
            letter-spacing: 1px;
            transition: color .2s;
        }

        .media-frame:hover .media-frame-header .frame-action {
            color: var(--glow);
        }

        .media-frame-body {
            position: relative;
            display: block;
            line-height: 0;
            background: rgba(0, 10, 6, 0.6);
        }

        .media-frame-body img {
            width: 100%;
            height: auto;
            display: block;
            cursor: zoom-in;
            transition: filter 0.2s ease;
        }

        .media-frame-body img:hover {
            filter: brightness(1.06);
        }

        .media-frame-body video {
            width: 100%;
            height: auto;
            display: block;
        }

        .overview-frame {
            width: 320px;
            max-width: 44%;
            flex-shrink: 0;
            align-self: flex-start;
        }

        .demo-frame {
            width: 100%;
            max-width: 740px;
            margin: 0 auto 12px auto;
        }

        .no-img {
            font-size: 9px;
            color: var(--c7);
            letter-spacing: 2px;
            padding: 30px;
            text-align: center;
        }

        /* DEMO SLIDER */
        .demo-slider {
            position: relative;
        }

        .demo-caption {
            font-size: 10px;
            color: var(--desc);
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
        }

        .demo-caption a {
            color: var(--glow);
            text-decoration: underline;
        }

        .demo-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px
        }

        .demo-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            color: var(--glow);
            background: rgba(0, 26, 10, .7);
            border: 1px solid var(--c7);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            transition: all .15s
        }

        .demo-btn:hover {
            border-color: var(--glow);
            background: rgba(0, 26, 10, .9)
        }

        .demo-counter {
            font-size: 9px;
            color: var(--c8);
            letter-spacing: 2px
        }

        /* NAV BAR — top right like game controls */
        #nav-bar {
            position: fixed;
            top: 36px;
            right: 32px;
            display: flex;
            gap: 12px;
            z-index: 60
        }

        .nav-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--c8);
            letter-spacing: 2px;
            padding: 6px 14px;
            border: 1px solid var(--c4);
            background: rgba(0, 0, 0, .7);
            cursor: pointer;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .nav-btn:hover {
            color: var(--glow);
            border-color: var(--glow);
            background: rgba(0, 26, 10, .7)
        }

        .nav-btn.active {
            color: var(--glow);
            border-color: var(--glow);
            background: rgba(0, 26, 10, .5);
            box-shadow: 0 0 8px rgba(0, 255, 153, 0.15);
            pointer-events: none;
        }

        .nav-btn.active .nav-key {
            color: var(--glow);
            background: rgba(0, 255, 153, 0.15);
        }

        .nav-key {
            font-family: 'VT323', monospace;
            font-size: 12px;
            color: var(--c9);
            background: var(--c4);
            padding: 2px 6px;
            letter-spacing: 1px
        }

        /* EMPTY STATE */
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 11px;
            color: var(--c7);
            letter-spacing: 3px
        }

        /* RESPONSIVE */
        @media(max-width:768px) {

            html,
            body {
                overflow-y: auto;
                overflow-x: hidden;
                cursor: default
            }

            #cursor,
            #cursor-dot {
                display: none
            }

            #header-bg {
                display: block;
                height: 130px;
            }

            #page-title {
                font-size: 28px;
                top: 14px;
                left: 16px;
                letter-spacing: 6px
            }

            #page-sub {
                top: 48px;
                left: 18px;
                font-size: 8px
            }

            #divider {
                top: 62px
            }

            #app {
                position: relative;
                top: auto;
                bottom: auto;
                flex-direction: column;
                min-height: calc(100vh - 140px);
                margin-top: 140px
            }

            #left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--c4);
                max-height: 40vh;
                overflow-y: auto
            }

            #right-panel {
                min-height: 50vh
            }

            #nav-bar {
                position: fixed;
                top: 74px;
                left: 16px;
                right: 16px;
                bottom: auto;
                justify-content: flex-start;
                padding: 0;
                flex-wrap: wrap;
                gap: 8px;
                z-index: 60;
            }

            .overview-wrap {
                flex-direction: column;
                gap: 16px;
            }

            .overview-frame {
                width: 100%;
                max-width: 100%;
                margin-top: 10px;
            }

            .proj-item {
                padding: 10px 14px;
                height: 74px;
            }
        }

        @media(max-width:480px) {
            #page-title {
                font-size: 22px;
                letter-spacing: 4px
            }

            .proj-title {
                font-size: 11px
            }

            .tab {
                padding: 6px 10px;
                font-size: 9px;
                letter-spacing: 1px
            }

            #content-area {
                padding: 16px
            }
        }

        /* LIGHTBOX MODAL */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 5, 2, 0.94);
            backdrop-filter: blur(8px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            flex-direction: column;
            gap: 14px;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--glow);
            background: rgba(0, 20, 10, 0.85);
            border: 1px solid var(--glow);
            padding: 8px 16px;
            border-radius: 2px;
            cursor: pointer;
            transition: all .2s;
            z-index: 510;
        }

        .lightbox-close:hover {
            background: var(--glow);
            color: #000;
        }

        /* Lightbox media container */
        .lightbox-media {
            max-width: 92vw;
            max-height: 78vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .lightbox-media img {
            max-width: 92vw;
            max-height: 78vh;
            object-fit: contain;
            border: 1px solid var(--glow);
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.35);
            border-radius: 4px;
            background: #000;
        }

        .lightbox-media video {
            max-width: 92vw;
            max-height: 78vh;
            object-fit: contain;
            border: 1px solid var(--glow);
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.35);
            border-radius: 4px;
            background: #000;
        }

        /* Lightbox caption */
        .lightbox-caption {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--desc);
            letter-spacing: 1.5px;
            text-align: center;
            max-width: 80vw;
            line-height: 1.6;
        }

        /* Lightbox navigation arrows */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--c7);
            background: rgba(0, 20, 10, 0.85);
            color: var(--glow);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            z-index: 510;
            font-family: 'Share Tech Mono', monospace;
        }

        .lightbox-nav:hover {
            border-color: var(--glow);
            background: rgba(0, 40, 20, 0.95);
            box-shadow: 0 0 12px rgba(0, 255, 153, 0.3);
        }

        .lightbox-nav.lb-prev {
            left: 20px;
        }

        .lightbox-nav.lb-next {
            right: 20px;
        }

        .lightbox-nav.hidden {
            display: none;
        }

        /* Lightbox counter */
        .lightbox-counter {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--c8);
            letter-spacing: 3px;
        }

        .lightbox-counter.hidden {
            display: none;
        }

        /* Clickable media in frames */
        .media-frame-body img,
        .media-frame-body video {
            cursor: zoom-in;
            transition: filter .2s ease;
        }

        .media-frame-body img:hover,
        .media-frame-body video:hover {
            filter: brightness(1.08);
        }

        @media (max-width: 768px) {
            .lightbox-nav {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .lightbox-nav.lb-prev { left: 8px; }
            .lightbox-nav.lb-next { right: 8px; }
        }
    </style>
</head>

<body>
    <div id="cursor"></div>
    <div id="cursor-dot"></div>
    <div id="scanlines"></div>
    <div id="grid-bg"></div>
    <canvas id="rain-canvas"></canvas>

    <div id="header-bg"></div>
    <div id="page-title">MISSIONS</div>
    <div id="page-sub">SELECT A PROJECT TO VIEW DETAILS</div>
    <div id="divider"></div>

    <div id="app">
        <div id="left-panel"></div>
        <div id="right-panel">
            <div id="tab-bar"></div>
            <div id="content-area">
                <div class="empty">← SELECT A PROJECT</div>
            </div>
        </div>
    </div>

    <div id="nav-bar"></div>

    <div id="lightbox" class="lightbox-modal">
        <button class="lightbox-close" id="lightbox-close">✕ CLOSE [ESC]</button>
        <button class="lightbox-nav lb-prev hidden" id="lb-prev">◀</button>
        <button class="lightbox-nav lb-next hidden" id="lb-next">▶</button>
        <div class="lightbox-media" id="lightbox-media"></div>
        <div class="lightbox-caption hidden" id="lightbox-caption"></div>
        <div class="lightbox-counter hidden" id="lightbox-counter"></div>
    </div>

    <script>
        /* CURSOR */
        const cur = document.getElementById('cursor'), dot = document.getElementById('cursor-dot');
        document.addEventListener('mousemove', e => { cur.style.left = e.clientX + 'px'; cur.style.top = e.clientY + 'px'; dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px' });

        /* ── PROJECT DATA — edit this JSON to manage your projects ── */
        const MISSIONS = [
    {
        "title": "HunterHR",
        "tagline": "AI-powered HR automation platform for screening, scheduling, and candidate communication.",
        "overview": {
            "text": "HunterHR is an AI-powered, end-to-end recruitment automation platform designed to streamline hiring workflows across email, WhatsApp, resume parsing, candidate scoring, and interview scheduling.\n\nRecruiters can create job openings with weighted criteria, automatically ingest applicant resumes via Gmail and WhatsApp scans, rank candidates using Ollama (LLaMA 3) and Qdrant vector embeddings, schedule interview slots synced with Google Calendar, and dispatch personalized offer or rejection letters using a rich-text template editor.\n\nOriginally prototyped with React, the system was completely re-architected into a modern Nuxt 4 full-stack platform with a high-throughput backend, responsive Nuxt UI v4 interface, and local AI inference.",
            "image": "hunterhr/candidates.png"
        },
        "userManual": "<b>User Story 1: Defining a Job Opening & AI Evaluation Criteria</b>\n<i>As a recruiter launching a new hiring drive:</i>\n1. Navigate to the <b>Jobs</b> page and create a new position with job title, salary band, qualifications, and locations.\n2. Configure custom evaluation weights (technical skills, work experience, projects) and define the minimum passing score threshold.\n3. Choose automated or manual shortlisting mode, then publish the job requisition.\n\n<b>User Story 2: Automated Multi-Channel Resume Sourcing</b>\n<i>As an HR team collecting candidate applications:</i>\n1. Open the <b>Scanners</b> dashboard to activate candidate sourcing pipelines.\n2. Connect your recruitment Gmail account to automatically scan and ingest PDF resumes from incoming emails.\n3. Link designated WhatsApp hiring groups using a quick QR code scan to capture resumes shared in group chats.\n4. Let the platform automatically extract text, remove duplicate submissions, and catalog candidate resumes.\n\n<b>User Story 3: AI Candidate Shortlisting & Profile Review</b>\n<i>As a hiring manager reviewing applicant fit:</i>\n1. Visit the <b>Candidates</b> table to inspect all processed applicants ranked by AI match scores.\n2. Filter applicants by score range, required skills, experience level, or status (Shortlisted, Selected, Rejected).\n3. Open any candidate record to review suitability breakdown, key qualifications, and the original resume file.\n4. Update candidate status with a single click to progress them through the recruitment pipeline.\n\n<b>User Story 4: Interview Scheduling & Calendar Sync</b>\n<i>As an interview coordinator organizing evaluation rounds:</i>\n1. Navigate to the <b>Interviews</b> page and create interview sessions with defined time slots, meeting mode (online video link or office location), and attendee capacity.\n2. Sync the schedule directly with Google Calendar to maintain real-time calendar availability without double-booking.\n3. Click <b>Smart Auto-Assign</b> to automatically distribute top-ranked shortlisted candidates into available interview slots, or assign slots manually.\n\n<b>User Story 5: Automated Candidate Communication & Template Dispatch</b>\n<i>As an HR specialist communicating outcomes:</i>\n1. Open the <b>Email Templates</b> editor to design personalized message templates for interview invites, offer letters, or polite rejections.\n2. Insert dynamic variables (such as candidate name, interview time, role title, and compensation offer) for automated personalization.\n3. Dispatch emails individually or in bulk directly from the portal to keep candidates informed at every stage.",

        "devNotes": "<b>Tech Stack</b>\nNuxt 4, Vue 3, Nuxt UI v4, TailwindCSS v4, TypeScript, Node.js (Nitro / H3), PostgreSQL 15, Qdrant Vector DB, Redis, Ollama (LLaMA 3 / Phi-3), Docker, Google Workspace APIs (Gmail & Calendar), WhatsApp-web.js (Puppeteer), Tiptap Editor, ImageKit\n\n<b>Evolution & Migration</b>\nOriginally developed and prototyped as a React + Node.js client-server application, HunterHR was fully redesigned and re-engineered into an all-in-one full-stack Nuxt 4 (Vue 3) application. The rewrite leveraged Nuxt server routes (Nitro/H3), reactive Nuxt UI components, and TailwindCSS v4 for unified developer ergonomics, faster SSR rendering, and robust state management.\n\n<b>AI Pipeline & Vector Search</b>\nResumes parsed from PDF streams are embedded using BAAI/bge-small-en-v1.5 into Qdrant for semantic cosine-similarity matching against active job requirements. Ollama runs local LLaMA 3 / Phi-3 models to classify application emails and validate candidate suitability with zero external data leakage.\n\n<b>Automation & Integration</b>\nFeatures background ingestion pipelines via WhatsApp-web.js (headless Puppeteer) and Gmail API, Google Calendar synchronization for two-way interview scheduling, and ImageKit CDN for persistent asset storage.",

            "text": "My journey of touch typing started back in high school. I spent months on keybr.com to unlearn bad habits and learn touch typing from scratch, then migrated to monkeytype.com to push my raw speed. Naturally, I wanted to build a tribute to the community that made me faster.\n\nOldMonkey is a <b>real-time multiplayer typing game</b> where players compete head-to-head, chasing live opponent cursors through paragraphs while WPM and accuracy update every keystroke.",

        "userManual": "<b>User Story 1: Joining the Arena & Account Setup</b>\n<i>As a player entering the competitive typing arena:</i>\n1. Sign up using email OTP verification or sign in instantly with Google.\n2. Access your profile dashboard displaying your starting competitive rating of 500.\n\n<b>User Story 2: Solo Practice Against the Adaptive Bot</b>\n<i>As a typist warming up and pushing raw speed limits:</i>\n1. Launch <b>Bot Mode</b> to enter a single-player challenge against the adaptive bot engine.\n2. Race against the bot as it dynamically benchmarks ~8 WPM above your personal best to push your speed limits.\n3. Track real-time typing speed (WPM) and accuracy metrics updating live with every keystroke.\n\n<b>User Story 3: Live Multiplayer Matchmaking & Head-to-Head Racing</b>\n<i>As a competitive typist challenging rivals:</i>\n1. Search for online players by username or filter opponents within specific WPM brackets (e.g., 60–70 WPM) for balanced races.\n2. Send direct match invites or join public race lobbies.\n3. Race head-to-head while watching your opponent's ghost cursor move character-by-character across the paragraph in real time.\n4. Win races to climb the competitive ladder with transparent +5 / -5 rating adjustments.\n\n<b>User Story 4: Social Interaction & Progress Tracking</b>\n<i>As an active player monitoring personal growth:</i>\n1. Use in-game chat to message rivals, celebrate victories, and coordinate rematch challenges.\n2. Review your game history to inspect past WPM charts, accuracy trends, and long-term typing milestones.",

            "text": "An end-to-end online examination platform designed for coaching institutes, teachers, and students to conduct secure and scalable assessments.\n\nThe platform supports <b>MCQ</b>, <b>numerical</b>, and <b>coding-based</b> examinations with advanced evaluation logic inspired by competitive exams like JEE and NTA-based assessments.\n\nThe system includes separate teacher and student portals, classroom management, scheduled and deadline-based tests, automatic evaluation, topic-wise analytics, and isolated Docker sandboxes for executing programming questions securely."

        "userManual": "<b>User Story 1: Classroom Setup & Student Onboarding (Teacher)</b>\n<i>As an educator managing a student cohort:</i>\n1. Create and manage virtual classrooms or study batches from the Teacher portal.\n2. Share unique classroom invite codes or invitation links with students.\n3. Review and approve or reject student join requests directly from the dashboard.\n\n<b>User Story 2: Comprehensive Assessment Authoring (Teacher)</b>\n<i>As an instructor designing an examination:</i>\n1. Create a new test with custom scheduling (live real-time window or deadline-based attempt window) and time limits.\n2. Configure flexible marking schemes: assign full marks for correct answers, negative marking for wrong attempts, and partial marking for multi-select questions.\n3. Add diverse problem types including MCQs, numerical inputs, and programming challenges with test cases.\n4. Upload question images, reference assets, and formatted code snippets.\n\n<b>User Story 3: Real-Time Examination Experience (Student)</b>\n<i>As a student taking a live test:</i>\n1. Join the classroom using the group code and launch the active exam.\n2. Navigate between questions using the question palette, flag questions for review, and track the live countdown timer.\n3. Write solutions for coding problems in the integrated editor with instant execution feedback against test cases.\n4. Stay focused within the exam tab: switching browser tabs triggers automated proctoring alerts and auto-submits upon repeated violations.\n\n<b>User Story 4: Instant Result Evaluation & Performance Analytics (Teacher & Student)</b>\n<i>As a student and educator reviewing assessment outcomes:</i>\n1. Receive instant automated score computation immediately after submitting the exam.\n2. Students can view detailed answer keys, solution explanations, and execution results for coding test cases.\n3. Teachers can inspect class-wide submission summaries, score distributions, and topic-wise analytics to identify areas for student improvement.",
        "devNotes": "<b>Architecture</b>\n\nThe platform follows a modular Django app-based architecture separating authentication, classroom management, testing, evaluation, analytics, and sandbox execution into independent domains.\n\n<b>Backend Stack</b>\n\n- Django\n- PostgreSQL\n- Redis\n- Docker\n- Docker Compose\n\n<b>Authentication</b>\n\nImplemented email OTP authentication using Redis for temporary OTP storage along with Google OIDC login using OAuth 2.0.\n\n<b>Realtime & Timer Logic</b>\n\nRedis was used for managing volatile exam state such as countdown timers, OTP expiry, and rapid-fire question timing.\n\n<b>Code Execution Sandbox</b>\n\nCoding questions are executed inside isolated Docker containers to securely run untrusted user code with controlled resources and hidden test cases.\n\n<b>Evaluation Engine</b>\n\nBuilt a custom scoring engine supporting:\n\n- Negative marking\n- Partial marking for MCQs\n- Numerical answer validation\n- Hidden test case evaluation\n- Auto-generated result computation.",

        "tagline": "An AI-driven job search engine that automates job discovery, matching, and monitoring.",
        "overview": {
            "text": "As a fresher actively applying for jobs myself, I wanted to build something that solves the “tab-fatigue” most job-seekers face.\n\nJob hunting today feels like a full-time unpaid job in itself.\nTwo hours on LinkedIn and Indeed… and Wellfound still left.\nEyes burning. Tabs everywhere.\n\nMost of us spend hours reading roles we don’t even qualify for: scrolling past Laravel jobs when our stack is Django, manually tracking what we applied to, and repeating the same searches every single day.\n\nSo I built 925buddy: a backend-first, AI-driven job search engine that scrapes, understands, matches, and monitors jobs automatically, so users stop searching and start receiving.",
            "image": "buddy925/fpg.png"
        },
        "userManual": "<b>User Story 1: Resume Upload & Profile Intelligence</b>\n<i>As a job seeker starting your search:</i>\n1. Upload your resume in PDF format to the platform.\n2. The system automatically analyzes your technical skills, work history, and target roles to construct your job-seeking profile.\n\n<b>User Story 2: Multi-Portal Job Aggregation & Centralized Discovery</b>\n<i>As an applicant eliminating tab fatigue:</i>\n1. Trigger automated job scraping across major portals (Indeed, Naukri) from a single interface.\n2. View all aggregated listings in a unified dashboard equipped with pagination, role filters, and location tags.\n3. Review clean, deduplicated job postings with highlighted key requirements matching your background.\n\n<b>User Story 3: Conversational AI Career Assistant</b>\n<i>As a candidate seeking personalized guidance:</i>\n1. Open the interactive career chatbot to ask questions about scraped jobs and your resume.\n2. Inquire with prompts like: “Which jobs fit my profile best?”, “What skills am I missing for senior backend roles?”, or “Draft a tailored application note for this role.”\n3. Receive accurate, hallucination-free advice directly matching your skills against active job descriptions.\n\n<b>User Story 4: Background Monitoring & Instant Match Alerts</b>\n<i>As a busy professional monitoring opportunities passively:</i>\n1. Schedule daily or weekly background scraping routines.\n2. Let the automated agent continuously scout portals for new openings matching your criteria.\n3. Receive email notifications whenever high-match opportunities are discovered so you can apply early.",
        "demo": {
            "items": [
                {
                    "file": "buddy925/fpg.png",
                    "caption": "view more on Linkedin: <a href='https://www.linkedin.com/posts/arghya-malakar-8b1410229_backendengineering-fastapi-rag-activity-7421863361329565696-9xVj?utm_source=share&utm_medium=member_desktop&rcm=ACoAADkxFgUB0ixGdxvX7hZTW4cvz_FnnwIMapE'>Click here</a>"

                    "caption": "Upload your resume"

        "devNotes": "<b>From the developer's perspective</b>\n\nThis system is built as a RAG + async backend pipeline:\n\n🔹 Data ingestion\n◽ Selenium + BeautifulSoup scrape full job descriptions\n◽ Jobs are normalized and stored in MongoDB\n◽ Each job is tagged to a specific user (multi-tenant design)\n\n🔹 Resume intelligence\n◽ PDF resumes are uploaded and stored securely in ImageKit\n◽ Text extracted via PyMuPDF\n◽ Chunked using LangChain RecursiveTextSplitter\n◽ Embedded with Sentence Transformers\n\n🔹 Vector search & RAG\n◽ Job + resume embeddings stored in ChromaDB\n◽ On every query:\n  - Relevant resume + job chunks retrieved via cosine similarity\n  - Context passed to Groq LLM\n  - Strict RAG guardrails prevent hallucination if no data exists\n\n🔹 Proactive search agent\n◽ Celery + Redis (RedBeat) handle scheduled scraping\n◽ Background workers:\n  - Scrape jobs\n  - Embed new data\n  - Compute similarity scores\n  - Trigger email alerts if score exceeds threshold\n\n🔹 Backend & infra\n◽ FastAPI (JWT auth, protected routes)\n◽ MongoDB (users, jobs, metadata)\n◽ ChromaDB (vector store)\n◽ Docker + Docker Compose (Redis, workers)\n◽ Fully async, non-blocking architecture\n\n<b>Tech Stack</b>\n\nFastAPI, Python, MongoDB, ChromaDB, Celery, Redis, Docker, Groq LLM, Sentence Transformers, Selenium, BeautifulSoup, PyMuPDF, LangChain, ImageKit",
        "github": "https://github.com/hunterarghya/RAG-Job-Finder-Chatbot"
    },

        "userManual": "<b>User Story 1: Campus Registration & Student Account</b>\n<i>As a college student joining the campus trading platform:</i>\n1. Register for an account and log in to access verified campus listings.\n2. Set up your user profile with contact details and campus hostel/day-scholar information.\n\n<b>User Story 2: Listing Items for Sale</b>\n<i>As a student selling textbooks, electronics, cycles, or hostel essentials:</i>\n1. Click “Sell Item” to create a new marketplace post.\n2. Fill in the title, category, description, and pricing for your listing.\n3. Upload clear photos of the item and publish it to the student marketplace.\n4. Edit, update, or remove your listings from your personal dashboard at any time.\n\n<b>User Story 3: Browsing & Purchasing from Campus Peers</b>\n<i>As a buyer looking for affordable campus items:</i>\n1. Browse marketplace listings using category filters and search keywords.\n2. View detailed product pages to inspect photos, condition, and seller details.\n3. Proceed to checkout and pay securely using the integrated Razorpay payment gateway.\n4. Receive payment verification and arrange on-campus handover with the seller.",

        "github": "https://github.com/hunterarghya/College-Marketplace"

];

        let activeProject = 0, activeTab = 'overview';

        /* BUILD LEFT PANEL */
        function buildList() {
            const lp = document.getElementById('left-panel'); lp.innerHTML = '';
            MISSIONS.forEach((p, i) => {
                const d = document.createElement('div'); d.className = 'proj-item' + (i === activeProject ? ' active' : '');
                d.innerHTML = '<div class="proj-title">' + p.title + '</div><div class="proj-tag">' + p.tagline + '</div><span class="proj-idx">' + String(i + 1).padStart(2, '0') + '</span>';
                d.addEventListener('click', () => { activeProject = i; activeTab = 'overview'; buildList(); buildTabs(); renderContent() });
                lp.appendChild(d);
            });
        }

        /* BUILD TAB BAR */
        function buildTabs() {
            const tb = document.getElementById('tab-bar'); tb.innerHTML = '';
            const p = MISSIONS[activeProject];
            const tabs = [];
            if (p.overview) tabs.push({ id: 'overview', label: 'OVERVIEW' });
            if (p.userManual) tabs.push({ id: 'userManual', label: 'USER MANUAL' });
            if (p.demo && p.demo.items && p.demo.items.length) tabs.push({ id: 'demo', label: 'DEMO' });
            if (p.devNotes) tabs.push({ id: 'devNotes', label: 'DEV NOTES' });
            if (p.github) tabs.push({ id: 'github', label: '', icon: true });
            if (p.live) tabs.push({ id: 'live', label: '● LIVE', isLive: true });

            if (!tabs.find(t => t.id === activeTab)) activeTab = tabs[0]?.id || 'overview';

            tabs.forEach(t => {
                const d = document.createElement('div');
                d.className = 'tab' + (t.id === activeTab && !t.isLive && !t.icon ? ' active' : '') + (t.isLive ? ' live-tab' : '');

                if (t.icon) {
                    d.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg> GITHUB';
                    d.addEventListener('click', () => window.open(p.github, '_blank'));
                } else if (t.isLive) {
                    d.textContent = t.label;
                    d.addEventListener('click', () => window.open(p.live, '_blank'));
                } else {
                    d.textContent = t.label;
                    d.addEventListener('click', () => { activeTab = t.id; buildTabs(); renderContent() });
                }
                tb.appendChild(d);
            });
        }

        /* RENDER CONTENT */
        let demoIdx = 0;
        function renderContent() {
            const ca = document.getElementById('content-area');
            const p = MISSIONS[activeProject];
            if (!p) return;
            if (activeTab === 'overview' && p.overview) {
                const hasImg = p.overview.image;
                const isVid = hasImg && (p.overview.image.endsWith('.mp4') || p.overview.image.endsWith('.webm'));
                let mediaHtml = '';
                if (hasImg) {
                    const clickAction = 'onclick="openLightboxSingle(\'' + p.overview.image + '\')"';
                    if (isVid) {
                        mediaHtml = '<div class="media-frame overview-frame"><div class="media-frame-header"><span class="frame-tag"><span class="frame-dot"></span>LIVE RECORD</span><span class="frame-action">CLICK TO ENLARGE</span></div><div class="media-frame-body"><video src="' + p.overview.image + '" autoplay muted loop playsinline ' + clickAction + ' title="Click to enlarge"></video></div></div>';
                    } else {
                        mediaHtml = '<div class="media-frame overview-frame"><div class="media-frame-header"><span class="frame-tag"><span class="frame-dot"></span>VISUAL RECORD</span><span class="frame-action">CLICK TO ENLARGE</span></div><div class="media-frame-body"><img src="' + p.overview.image + '" ' + clickAction + ' title="Click to enlarge" onerror="this.parentElement.parentElement.innerHTML=\'<div class=no-img>NO IMAGE</div>\'"></div></div>';
                    }
                }
                ca.innerHTML = '<div class="overview-wrap"><div class="overview-text"><div class="content-title">' + p.title + '</div><div class="content-text">' + p.overview.text + '</div></div>' + mediaHtml + '</div>';
            } else if (activeTab === 'userManual' && p.userManual) {
                ca.innerHTML = '<div class="content-title">USER MANUAL</div><div class="content-text">' + p.userManual + '</div>';
            } else if (activeTab === 'demo' && p.demo) {
                demoIdx = 0; renderDemo(ca, p);
            } else if (activeTab === 'devNotes' && p.devNotes) {
                ca.innerHTML = '<div class="content-title">DEV NOTES</div><div class="content-text">' + p.devNotes + '</div>';
            } else {
                ca.innerHTML = '<div class="empty">NO CONTENT</div>';
            }
        }

        function renderDemo(ca, p) {
            const items = p.demo.items; const item = items[demoIdx];
            const isVideo = item.file && (item.file.endsWith('.mp4') || item.file.endsWith('.webm'));
            let media = '';
            if (item.file) {
                const clickAction = 'onclick="openLightboxDemo(' + demoIdx + ')"';
                media = isVideo
                    ? '<video src="' + item.file + '" controls playsinline ' + clickAction + ' title="Click to enlarge"></video>'
                    : '<img src="' + item.file + '" ' + clickAction + ' title="Click to enlarge" onerror="this.parentElement.parentElement.innerHTML=\'<div class=no-img>NO MEDIA</div>\'">';
            } else { media = '<div class="no-img">NO MEDIA FILE</div>' }
            ca.innerHTML = '<div class="demo-slider">' + (item.caption ? '<div class="demo-caption">' + item.caption + '</div>' : '') + '<div class="media-frame demo-frame"><div class="media-frame-header"><span class="frame-tag"><span class="frame-dot"></span>DEMO // ' + (demoIdx + 1) + ' OF ' + items.length + '</span><span class="frame-action">CLICK TO ENLARGE</span></div><div class="media-frame-body">' + media + '</div></div><div class="demo-controls"><button class="demo-btn" id="demo-prev">◀</button><div class="demo-counter">' + (demoIdx + 1) + ' / ' + items.length + '</div><button class="demo-btn" id="demo-next">▶</button></div></div>';
            document.getElementById('demo-prev').onclick = () => { demoIdx = (demoIdx - 1 + items.length) % items.length; renderDemo(ca, p) };
            document.getElementById('demo-next').onclick = () => { demoIdx = (demoIdx + 1) % items.length; renderDemo(ca, p) };
        }

        /* ── LIGHTBOX SYSTEM ── */
        let lbItems = [];   // array of {file, caption} for navigable mode
        let lbIdx = 0;      // current index in navigable mode
        let lbMode = 'single'; // 'single' or 'demo'

        function openLightboxSingle(src) {
            if (!src) return;
            lbMode = 'single';
            lbItems = [{ file: src, caption: '' }];
            lbIdx = 0;
            renderLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function openLightboxDemo(startIdx) {
            const p = MISSIONS[activeProject];
            if (!p || !p.demo || !p.demo.items) return;
            lbMode = 'demo';
            lbItems = p.demo.items;
            lbIdx = startIdx;
            renderLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function renderLightbox() {
            const mediaContainer = document.getElementById('lightbox-media');
            const captionEl = document.getElementById('lightbox-caption');
            const counterEl = document.getElementById('lightbox-counter');
            const prevBtn = document.getElementById('lb-prev');
            const nextBtn = document.getElementById('lb-next');

            // Stop any playing video before switching
            const oldVid = mediaContainer.querySelector('video');
            if (oldVid) { oldVid.pause(); oldVid.src = ''; }

            const item = lbItems[lbIdx];
            const src = item.file || item;
            const isVid = src && (src.endsWith('.mp4') || src.endsWith('.webm'));

            if (isVid) {
                mediaContainer.innerHTML = '<video src="' + src + '" controls autoplay playsinline></video>';
            } else {
                mediaContainer.innerHTML = '<img src="' + src + '" alt="Full view">';
            }

            // Caption
            if (item.caption && item.caption.trim()) {
                captionEl.innerHTML = item.caption;
                captionEl.classList.remove('hidden');
            } else {
                captionEl.classList.add('hidden');
            }

            // Nav arrows + counter
            if (lbItems.length > 1) {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                counterEl.textContent = (lbIdx + 1) + ' / ' + lbItems.length;
                counterEl.classList.remove('hidden');
            } else {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                counterEl.classList.add('hidden');
            }
        }

        function lbNavigate(dir) {
            if (lbItems.length <= 1) return;
            lbIdx = ((lbIdx + dir) + lbItems.length) % lbItems.length;
            renderLightbox();
            // If we came from demo mode, also sync the background demo slider
            if (lbMode === 'demo') {
                demoIdx = lbIdx;
                const ca = document.getElementById('content-area');
                const p = MISSIONS[activeProject];
                renderDemo(ca, p);
            }
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            // Stop video on close
            const vid = document.getElementById('lightbox-media').querySelector('video');
            if (vid) { vid.pause(); vid.src = ''; }
            lb.classList.remove('active');
        }

        // Click outside media to close
        document.getElementById('lightbox').addEventListener('click', e => {
            const mediaEl = document.getElementById('lightbox-media');
            if (!mediaEl.contains(e.target) &&
                e.target.id !== 'lb-prev' && e.target.id !== 'lb-next' &&
                e.target.id !== 'lightbox-close') {
                closeLightbox();
            }
        });
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lb-prev').addEventListener('click', () => lbNavigate(-1));
        document.getElementById('lb-next').addEventListener('click', () => lbNavigate(1));

        /* BUILD NAV BAR — top right, like game control hints */
        function buildNav() {
            const nb = document.getElementById('nav-bar'); nb.innerHTML = '';
            const currentPage = 'projects.html';
            const pages = [
                { key: 'H', label: 'Home', href: 'index.html' },
                { key: 'M', label: 'Missions', href: 'projects.html' },
                { key: 'A', label: 'Arsenal', href: 'skills.html' },
                { key: 'S', label: 'Storyline', href: 'experience.html' },
                { key: 'L', label: 'Lore', href: 'about.html' }
            ];
            pages.forEach(p => {
                const b = document.createElement('div');
                b.className = 'nav-btn' + (p.href === currentPage ? ' active' : '');
                b.innerHTML = '<span class="nav-key">' + p.key + '</span> ' + p.label;
                if (p.href !== currentPage) b.addEventListener('click', () => location.href = p.href);
                nb.appendChild(b);
            });
            // keyboard shortcuts
            document.addEventListener('keydown', e => {
                const lb = document.getElementById('lightbox');
                const lbActive = lb.classList.contains('active');
                if (e.key === 'Escape') { closeLightbox(); return; }
                // Arrow navigation inside lightbox
                if (lbActive) {
                    if (e.key === 'ArrowLeft') { e.preventDefault(); lbNavigate(-1); return; }
                    if (e.key === 'ArrowRight') { e.preventDefault(); lbNavigate(1); return; }
                    return; // swallow other keys while lightbox is open
                }
                const k = e.key.toUpperCase();
                const match = pages.find(p => p.key === k && p.href !== currentPage);
                if (match) location.href = match.href;
            });
        }

        /* DYNAMIC JSON LOAD WITH FALLBACK */
        fetch('data/projects.json')
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                if (Array.isArray(data) && data.length) {
                    MISSIONS.length = 0;
                    data.forEach(item => MISSIONS.push(item));
                    buildList();
                    buildTabs();
                    renderContent();
                }
            })
            .catch(() => {});

        /* INIT */
        buildList(); buildTabs(); renderContent(); buildNav();

        /* MATRIX RAIN */
        (function () {
            const cv = document.getElementById('rain-canvas'), c = cv.getContext('2d');
            function rs() { cv.width = innerWidth; cv.height = innerHeight } rs(); window.addEventListener('resize', rs);
            const cols = Math.floor(innerWidth / 18), dr = Array(cols).fill(0).map(() => Math.random() * -60);
            function draw() {
                c.fillStyle = 'rgba(0,0,0,0.05)'; c.fillRect(0, 0, cv.width, cv.height); c.font = '11px "Share Tech Mono"';
                dr.forEach((y, i) => { c.fillStyle = Math.random() > .97 ? '#00ff99' : '#001a0a'; c.fillText(Math.random() > .5 ? '1' : '0', i * 18, y * 18); if (y * 18 > cv.height && Math.random() > .978) dr[i] = 0; dr[i] += .35 }); requestAnimationFrame(draw)
            } draw()
        })();
    </script>
