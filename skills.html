<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILLS — ARGHYA MALAKAR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        :root {
            --c0: #000000;
            --c1: #001000;
            --c2: #001010;
            --c3: #002010;
            --c4: #002020;
            --c5: #003030;
            --c6: #103020;
            --c7: #104040;
            --c8: #105050;
            --c9: #106060;
            --glow: #00ff99;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            cursor: none;
        }

        /* CURSOR */
        #cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            border: 1px solid var(--glow);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        #cursor-dot {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--glow);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        /* SCANLINES */
        #scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0, 0, 0, 0.07) 3px, rgba(0, 0, 0, 0.07) 4px);
            pointer-events: none;
            z-index: 100;
        }

        #vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        #grid-bg {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--c1) 1px, transparent 1px), linear-gradient(90deg, var(--c1) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.35;
            z-index: 0;
        }

        /* CORNERS */
        .corner {
            position: fixed;
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 50;
        }

        .corner svg {
            width: 100%;
            height: 100%;
        }

        .ctL {
            top: 18px;
            left: 18px;
        }

        .ctR {
            top: 18px;
            right: 18px;
            transform: scaleX(-1);
        }

        .cbL {
            bottom: 18px;
            left: 18px;
            transform: scaleY(-1);
        }

        .cbR {
            bottom: 18px;
            right: 18px;
            transform: scale(-1);
        }

        /* PAGE TITLE */
        #page-id {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'VT323', monospace;
            font-size: 14px;
            color: var(--c8);
            letter-spacing: 6px;
            z-index: 60;
            pointer-events: none;
        }

        /* FULL SCREEN CANVAS LAYOUT */
        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* DIAL CONTAINER — always centered */
        #dial-wrap {
            position: relative;
            width: 280px;
            height: 280px;
            flex-shrink: 0;
            z-index: 20;
        }

        #wheel-svg {
            width: 100%;
            height: 100%;
            transition: filter .3s;
            cursor: none;
        }

        #wheel-svg.hot {
            filter: drop-shadow(0 0 14px rgba(0, 255, 128, .22));
        }

        #wheel-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }

        #wl-name {
            font-family: 'VT323', monospace;
            font-size: 17px;
            color: var(--glow);
            letter-spacing: 4px;
            display: block;
            min-height: 20px;
        }

        #wl-hint {
            font-size: 8px;
            color: var(--c7);
            letter-spacing: 2px;
            display: block;
            margin-top: 3px;
        }

        /* SKILL CLUSTERS — absolutely positioned around the dial */
        #clusters {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 15;
        }

        .cluster {
            position: absolute;
            pointer-events: all;
            opacity: 0;
            animation: fadeUp .5s forwards;
        }

        .cluster-name {
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--c8);
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid var(--c4);
            padding-bottom: 5px;
        }

        .cluster-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 220px;
        }

        .skill-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 54px;
            padding: 8px 4px;
            border: 1px solid var(--c4);
            background: rgba(0, 10, 0, 0.7);
            transition: border-color .2s, background .2s;
            cursor: default;
        }

        .skill-tile:hover {
            border-color: var(--glow);
            background: rgba(0, 26, 10, 0.85);
        }

        .skill-tile img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            /* all icons rendered green */
            filter: invert(1) sepia(1) saturate(3) hue-rotate(90deg) brightness(1.1);
            opacity: 0.85;
            transition: opacity .2s;
        }

        /* white-brand icons (postgres, mongo, redis etc) override the green filter */
        .skill-tile img.brand-white {
            filter: invert(1) brightness(1.5);
            opacity: 0.9;
        }

        .skill-tile:hover img {
            opacity: 1;
        }

        .skill-name {
            font-size: 7px;
            color: var(--c8);
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.2;
        }

        .skill-tile:hover .skill-name {
            color: var(--glow);
        }

        /* connector line from cluster to dial center — drawn on SVG layer */
        #connectors {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 14;
        }

        /* MATRIX RAIN */
        #rain-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.1;
        }

        /* PAGE OVERLAY for other sections */
        #overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s;
        }

        #overlay.vis {
            opacity: 1;
            pointer-events: all;
        }

        #ov-title {
            font-family: 'VT323', monospace;
            font-size: 60px;
            color: var(--glow);
            letter-spacing: 12px;
            margin-bottom: 12px;
        }

        #ov-sub {
            font-size: 11px;
            color: var(--c8);
            letter-spacing: 4px;
            margin-bottom: 34px;
        }

        #back-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--c9);
            letter-spacing: 3px;
            border: 1px solid var(--c7);
            padding: 9px 28px;
            background: transparent;
            cursor: pointer;
            transition: all .2s;
        }

        #back-btn:hover {
            background: var(--c3);
            color: var(--glow);
            border-color: var(--glow);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* connector SVG lines */
        .conn-line {
            stroke: var(--c4);
            stroke-width: 1;
            stroke-dasharray: 4 4;
            opacity: 0.5;
        }

        /* ── WHEEL NAV BUTTONS (mobile) ── */
        .wheel-nav {
            display: none;
            position: absolute;
            bottom: -44px;
            left: 50%;
            transform: translateX(-50%);
            gap: 18px;
            z-index: 25;
        }

        .wheel-nav button {
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            color: var(--glow);
            background: rgba(0, 26, 10, 0.7);
            border: 1px solid var(--c7);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all .2s;
            -webkit-tap-highlight-color: transparent;
        }

        .wheel-nav button:active {
            background: var(--c5);
            border-color: var(--glow);
        }

        .wheel-enter-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--glow);
            background: rgba(0, 26, 10, 0.7);
            border: 1px solid var(--c7);
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            display: none;
            position: absolute;
            bottom: -86px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            transition: all .2s;
        }

        .wheel-enter-btn:active {
            background: var(--c5);
            border-color: var(--glow);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {

            html,
            body {
                overflow-y: auto;
                overflow-x: hidden;
                cursor: default;
            }

            #cursor,
            #cursor-dot {
                display: none;
            }

            #vignette {
                display: none;
            }

            .corner {
                display: none;
            }

            #page-id {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                text-align: center;
                padding: 18px 0 10px;
                z-index: 60;
            }

            /* Clusters: switch to normal flow */
            #clusters {
                position: relative;
                inset: auto;
                pointer-events: all;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 24px;
                padding: 10px 16px 30px;
                z-index: 15;
            }

            .cluster {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                right: auto !important;
                bottom: auto !important;
                transform: none !important;
                width: calc(50% - 12px);
                min-width: 150px;
            }

            .cluster-icons {
                max-width: 100%;
            }

            /* Connectors hidden on mobile */
            #connectors {
                display: none;
            }

            /* Dial: relative flow, centered */
            #stage {
                position: relative;
                inset: auto;
                padding: 20px 0 80px;
            }

            #dial-wrap {
                width: 220px;
                height: 220px;
            }

            .wheel-nav {
                display: flex;
            }

            .wheel-enter-btn {
                display: block;
            }

            #wl-hint {
                display: none;
            }

            #ov-title {
                font-size: 36px;
                letter-spacing: 6px;
            }

            #ov-sub {
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .cluster {
                width: 100%;
            }

            .cluster-icons {
                justify-content: center;
            }

            #dial-wrap {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <div id="cursor"></div>
    <div id="cursor-dot"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="grid-bg"></div>
    <canvas id="rain-canvas"></canvas>

    <!-- CORNERS -->
    <div class="corner ctL"><svg viewBox="0 0 50 50" fill="none">
            <path d="M2 26L2 2L26 2" stroke="#106060" stroke-width="1.5" />
            <path d="M2 12L2 2L12 2" stroke="#00ff99" stroke-width="0.7" />
            <circle cx="2" cy="2" r="1.5" fill="#106060" />
        </svg></div>
    <div class="corner ctR"><svg viewBox="0 0 50 50" fill="none">
            <path d="M2 26L2 2L26 2" stroke="#106060" stroke-width="1.5" />
            <path d="M2 12L2 2L12 2" stroke="#00ff99" stroke-width="0.7" />
            <circle cx="2" cy="2" r="1.5" fill="#106060" />
        </svg></div>
    <div class="corner cbL"><svg viewBox="0 0 50 50" fill="none">
            <path d="M2 26L2 2L26 2" stroke="#106060" stroke-width="1.5" />
            <path d="M2 12L2 2L12 2" stroke="#00ff99" stroke-width="0.7" />
            <circle cx="2" cy="2" r="1.5" fill="#106060" />
        </svg></div>
    <div class="corner cbR"><svg viewBox="0 0 50 50" fill="none">
            <path d="M2 26L2 2L26 2" stroke="#106060" stroke-width="1.5" />
            <path d="M2 12L2 2L12 2" stroke="#00ff99" stroke-width="0.7" />
            <circle cx="2" cy="2" r="1.5" fill="#106060" />
        </svg></div>

    <div id="page-id">// SKILLS</div>

    <!-- CONNECTOR LINES SVG -->
    <svg id="connectors" viewBox="0 0 1 1" preserveAspectRatio="none" style="width:100%;height:100%;"></svg>

    <!-- SKILL CLUSTERS -->
    <div id="clusters"></div>

    <!-- CENTERED DIAL -->
    <div id="stage">
        <div id="dial-wrap">
            <svg id="wheel-svg" viewBox="-140 -140 280 280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="hg" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#001a0a" />
                        <stop offset="100%" stop-color="#000000" />
                    </radialGradient>
                </defs>
                <circle cx="0" cy="0" r="126" fill="none" stroke="#102018" stroke-width="0.5" />
                <circle cx="0" cy="0" r="128" fill="none" stroke="#002020" stroke-width="1" />
                <circle cx="0" cy="0" r="88" fill="none" stroke="#002020" stroke-width="1" />
                <circle cx="0" cy="0" r="42" fill="none" stroke="#003030" stroke-width="1" />
                <g id="sg"></g>
                <g id="pk"></g>
                <g id="lg"></g>
                <g id="tg"></g>
                <circle cx="0" cy="0" r="42" fill="url(#hg)" stroke="#106060" stroke-width="1.5" />
                <circle cx="0" cy="0" r="34" fill="none" stroke="#103020" stroke-width="0.4" />
                <line x1="-10" y1="0" x2="10" y2="0" stroke="#106060" stroke-width="0.8" />
                <line x1="0" y1="-10" x2="0" y2="10" stroke="#106060" stroke-width="0.8" />
                <circle cx="0" cy="0" r="2.5" fill="#106060" />
            </svg>
            <div id="wheel-label">
                <span id="wl-name">SKILLS</span>
                <span id="wl-hint">SCROLL TO SWITCH</span>
            </div>
            <div class="wheel-nav">
                <button id="nav-prev" aria-label="Previous section">◀</button>
                <button id="nav-next" aria-label="Next section">▶</button>
            </div>

        </div>
    </div>

    <!-- SECTION OVERLAY -->
    <div id="overlay">
        <div id="ov-title">SECTION</div>
        <div id="ov-sub">[ COMING SOON ]</div>
        <button id="back-btn" onclick="document.getElementById('overlay').classList.remove('vis')">← BACK</button>
    </div>

    <script>
        /* ── CURSOR ── */
        const cur = document.getElementById('cursor'), dot = document.getElementById('cursor-dot');
        document.addEventListener('mousemove', e => {
            cur.style.left = e.clientX + 'px'; cur.style.top = e.clientY + 'px';
            dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
        });

        /* ── WEAPON WHEEL ── */
        const SEC = ['HOME', 'PROJECTS', 'SKILLS', 'EXPERIENCE', 'ABOUT'];
        const N = SEC.length, SL = (2 * Math.PI) / N;
        const RO = 128, RI = 88, RL = 108;
        // Start with SKILLS selected (index 2)
        let cur_ = 2, wRot = 0, tRot = 0, raf = null, hot = false, locked = false;
        const ns = 'http://www.w3.org/2000/svg';

        function mk(t, a) { const e = document.createElementNS(ns, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; }
        function P(a, r) { return [Math.cos(a) * r, Math.sin(a) * r]; }
        function arc(sa, ea, ri, ro) {
            const [x1, y1] = P(sa, ro), [x2, y2] = P(ea, ro), [x3, y3] = P(ea, ri), [x4, y4] = P(sa, ri);
            const lg = ea - sa > Math.PI ? 1 : 0;
            return `M${x1},${y1}A${ro},${ro} 0 ${lg} 1 ${x2},${y2}L${x3},${y3}A${ri},${ri} 0 ${lg} 0 ${x4},${y4}Z`;
        }

        const SG = document.getElementById('sg'), PK = document.getElementById('pk');
        const LG = document.getElementById('lg'), TG = document.getElementById('tg');

        function buildWheel() {
            [SG, PK, LG, TG].forEach(g => g.innerHTML = '');
            const off = -Math.PI / 2 - SL / 2;
            for (let i = 0; i < N; i++) {
                const sa = off + i * SL, ea = sa + SL, mid = (sa + ea) / 2;
                SG.appendChild(mk('path', { d: arc(sa, ea, RI, RO), fill: '#000a00', stroke: '#002020', 'stroke-width': '0.8', id: 's' + i }));
                const [sx, sy] = P(sa, RO + 2), [sx2, sy2] = P(sa, RI - 2);
                PK.appendChild(mk('line', { x1: sx2, y1: sy2, x2: sx, y2: sy, stroke: '#002020', 'stroke-width': '0.8' }));
                const [lx, ly] = P(mid, RL);
                const t = mk('text', { x: lx, y: ly + 3, 'text-anchor': 'middle', 'font-size': '8', 'font-family': "'Share Tech Mono',monospace", 'letter-spacing': '2', fill: '#104040', id: 'l' + i });
                t.textContent = SEC[i];
                LG.appendChild(t);
            }
            for (let t = 0; t < 60; t++) {
                const a = (t / 60) * 2 * Math.PI - Math.PI / 2, maj = t % 10 === 0;
                const [x1, y1] = P(a, RO + 1), [x2, y2] = P(a, RO + (maj ? 7 : 3));
                TG.appendChild(mk('line', { x1, y1, x2, y2, stroke: maj ? '#105050' : '#002020', 'stroke-width': maj ? '0.9' : '0.4' }));
            }
            refresh();
        }

        function refresh() {
            for (let i = 0; i < N; i++) {
                const s = document.getElementById('s' + i), l = document.getElementById('l' + i);
                if (i === cur_) {
                    s.setAttribute('fill', '#001a08'); s.setAttribute('stroke', '#00ff99'); s.setAttribute('stroke-width', '1.5');
                    l.setAttribute('fill', '#00ff99'); l.setAttribute('font-weight', '600');
                } else {
                    s.setAttribute('fill', '#000a00'); s.setAttribute('stroke', '#002020'); s.setAttribute('stroke-width', '0.8');
                    l.setAttribute('fill', '#104040'); l.setAttribute('font-weight', '400');
                }
            }
            document.getElementById('wl-name').textContent = SEC[cur_];
        }

        function spin() {
            const d = tRot - wRot;
            if (Math.abs(d) > .12) {
                wRot += d * .13;
                SG.setAttribute('transform', `rotate(${wRot})`);
                PK.setAttribute('transform', `rotate(${wRot})`);
                TG.setAttribute('transform', `rotate(${wRot})`);
                LG.setAttribute('transform', `rotate(${wRot})`);
                const off = -Math.PI / 2 - SL / 2;
                for (let i = 0; i < N; i++) {
                    const mid = off + i * SL + SL / 2, [lx, ly] = P(mid, RL);
                    document.getElementById('l' + i).setAttribute('transform', `rotate(${-wRot} ${lx} ${ly})`);
                }
                raf = requestAnimationFrame(spin);
            } else { wRot = tRot; }
        }

        buildWheel();

        const cp = document.getElementById('dial-wrap');
        cp.addEventListener('mouseenter', () => {
            hot = true;
            document.getElementById('wheel-svg').classList.add('hot');
            document.getElementById('wl-hint').textContent = 'SCROLL · CLICK ENTER';
        });
        cp.addEventListener('mouseleave', () => {
            hot = false;
            document.getElementById('wheel-svg').classList.remove('hot');
            document.getElementById('wl-hint').textContent = 'SCROLL TO SWITCH';
        });

        /* Desktop: scroll to rotate */
        window.addEventListener('wheel', e => {
            if (!hot || locked) return;
            e.preventDefault();
            locked = true;
            const dir = e.deltaY > 0 ? 1 : -1;
            stepWheel(dir);
            setTimeout(() => { locked = false; }, 300);
        }, { passive: false });

        /* Desktop: click to enter */
        cp.addEventListener('click', () => {
            if (!hot) return;
            openSection();
        });

        /* Shared helpers */
        function stepWheel(dir) {
            cur_ = ((cur_ + dir) + N) % N;
            tRot -= dir * (360 / N);
            refresh();
            cancelAnimationFrame(raf);
            spin();
        }

        function openSection() {
            const s = SEC[cur_];
            if (s === 'SKILLS') return; // already here
            if (s === 'HOME') { window.location.href = 'index.html'; return; }
            if (s === 'EXPERIENCE') { window.location.href = 'experience.html'; return; }
            if (s === 'ABOUT') { window.location.href = 'about.html'; return; }
            if (s === 'PROJECTS') { window.location.href = 'projects.html'; return; }
            document.getElementById('ov-title').textContent = s;
            document.getElementById('ov-sub').textContent = '[ ' + s + ' — COMING SOON ]';
            document.getElementById('overlay').classList.add('vis');
        }

        /* Mobile: prev / next buttons */
        document.getElementById('nav-prev').addEventListener('click', (e) => { e.stopPropagation(); stepWheel(-1); });
        document.getElementById('nav-next').addEventListener('click', (e) => { e.stopPropagation(); stepWheel(1); });


        /* Mobile: swipe on wheel */
        let touchStartX = 0, touchStartY = 0;
        cp.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        cp.addEventListener('touchend', (e) => {
            if (locked) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const absDx = Math.abs(dx), absDy = Math.abs(dy);
            if (Math.max(absDx, absDy) < 30) return;
            locked = true;
            if (absDx >= absDy) {
                stepWheel(dx > 0 ? 1 : -1);
            } else {
                stepWheel(dy > 0 ? 1 : -1);
            }
            setTimeout(() => { locked = false; }, 300);
        }, { passive: true });

        /* ── SKILLS DATA (inlined — fetch fails on file:// protocol) ── */
        const SKILLS_DATA = {
            "groups": [
                {
                    "name": "Languages",
                    "position": "top-left",
                    "skills": [
                        { "name": "Python", "slug": "python" },
                        { "name": "C#", "slug": "csharp" },
                        { "name": "Go", "slug": "go" },
                        { "name": "JavaScript", "slug": "javascript" },
                        { "name": "SQL", "slug": "postgresql" },
                        { "name": "Bash", "slug": "gnubash" }
                    ]
                },
                {
                    "name": "Frameworks",
                    "position": "top-right",
                    "skills": [
                        { "name": "FastAPI", "slug": "fastapi" },
                        { "name": "Django", "slug": "django" },
                        { "name": "Node.js", "slug": "nodedotjs" },
                        { "name": "Nuxt.js", "slug": "nuxtdotjs" },
                        { "name": "React", "slug": "react" },
                        { "name": "Vue", "slug": "vuedotjs" }
                    ]
                },
                {
                    "name": "Databases",
                    "position": "left",
                    "skills": [
                        { "name": "PostgreSQL", "slug": "postgresql" },
                        { "name": "MongoDB", "slug": "mongodb" },
                        { "name": "Redis", "slug": "redis" },
                        { "name": "RabbitMQ", "slug": "rabbitmq" }
                    ]
                },
                {
                    "name": "Agentic AI",
                    "position": "right",
                    "skills": [
                        { "name": "LangChain", "slug": "langchain" },
                        { "name": "CrewAI", "slug": "crewai" },
                        { "name": "Google ADK", "slug": "google" },
                        { "name": "Vercel AI", "slug": "vercel" },
                        { "name": "n8n", "slug": "n8n" },
                        { "name": "ChromaDB", "slug": "chroma" },
                        { "name": "Qdrant", "slug": "qdrant" }
                    ]
                },
                {
                    "name": "DevOps & Infra",
                    "position": "bottom",
                    "skills": [
                        { "name": "Docker", "slug": "docker" },
                        { "name": "GitHub Actions", "slug": "githubactions" },
                        { "name": "RabbitMQ", "slug": "rabbitmq" }
                    ]
                }
            ]
        };

        function loadSkills() {
            renderClusters(SKILLS_DATA.groups);
        }

        /* ── CLUSTER POSITIONING ──
           5 positions around the centered dial.
           Dial center is at 50vw, 50vh.
           Each position gives an anchor point and alignment.
        */
        function getPosition(pos) {
            // returns {top,left,right,bottom,transform} in CSS
            // positions are chosen to leave the 300px center dial clear
            const positions = {
                'top-left': { top: '8vh', left: '3vw' },
                'top-right': { top: '8vh', right: '3vw' },
                'left': { top: '50%', left: '2vw', transform: 'translateY(-50%)' },
                'right': { top: '50%', right: '2vw', transform: 'translateY(-50%)' },
                'bottom': { bottom: '6vh', left: '50%', transform: 'translateX(-50%)' },
            };
            return positions[pos] || { top: '10vh', left: '10vw' };
        }

        function renderClusters(groups) {
            const container = document.getElementById('clusters');
            container.innerHTML = '';

            groups.forEach((group, gi) => {
                const pos = getPosition(group.position);

                const div = document.createElement('div');
                div.className = 'cluster';
                div.style.animationDelay = (gi * 0.12) + 's';

                // apply position styles
                Object.entries(pos).forEach(([k, v]) => div.style[k] = v);

                // cluster header
                const header = document.createElement('div');
                header.className = 'cluster-name';
                header.textContent = group.name;
                div.appendChild(header);

                // icons grid
                const grid = document.createElement('div');
                grid.className = 'cluster-icons';

                group.skills.forEach(skill => {
                    const tile = document.createElement('div');
                    tile.className = 'skill-tile';

                    const img = document.createElement('img');
                    // simple-icons CDN — slug must match simple-icons name exactly
                    img.src = `https://cdn.simpleicons.org/${skill.slug}`;
                    img.alt = skill.name;
                    img.title = skill.name;

                    // white-brand icons: postgres, mongo, redis (their logos need white not green)
                    const whiteBrands = ['postgresql', 'mongodb', 'redis', 'rabbitmq', 'docker'];
                    if (whiteBrands.includes(skill.slug)) img.classList.add('brand-white');

                    img.onerror = () => {
                        // fallback: show initials if icon not found
                        img.style.display = 'none';
                        const fb = document.createElement('div');
                        fb.style.cssText = 'width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#106060;border:1px solid #003030;';
                        fb.textContent = skill.name.slice(0, 2).toUpperCase();
                        tile.insertBefore(fb, tile.firstChild);
                    };

                    const name = document.createElement('div');
                    name.className = 'skill-name';
                    name.textContent = skill.name;

                    tile.appendChild(img);
                    tile.appendChild(name);
                    grid.appendChild(tile);
                });

                div.appendChild(grid);
                container.appendChild(div);
            });

            // Draw connector lines after clusters are in DOM
            requestAnimationFrame(() => drawConnectors(groups));
        }

        /* ── CONNECTOR LINES ──
           Draw dashed lines from each cluster center to dial center.
        */
        function drawConnectors(groups) {
            const svg = document.getElementById('connectors');
            svg.innerHTML = '';
            svg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
            svg.style.width = '100%';
            svg.style.height = '100%';

            const dialCx = window.innerWidth / 2;
            const dialCy = window.innerHeight / 2;

            const clusters = document.querySelectorAll('.cluster');
            clusters.forEach(cl => {
                const r = cl.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx); line.setAttribute('y1', cy);
                line.setAttribute('x2', dialCx); line.setAttribute('y2', dialCy);
                line.setAttribute('class', 'conn-line');
                svg.appendChild(line);

                // small dot at cluster end
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
                circle.setAttribute('r', '3');
                circle.setAttribute('fill', '#106060');
                circle.setAttribute('opacity', '0.6');
                svg.appendChild(circle);
            });
        }

        window.addEventListener('resize', () => {
            const clusters = document.querySelectorAll('.cluster');
            if (clusters.length) drawConnectors();
        });

        /* ── MATRIX RAIN ── */
        (function () {
            const cv = document.getElementById('rain-canvas');
            const c = cv.getContext('2d');
            function rs() { cv.width = innerWidth; cv.height = innerHeight; } rs();
            window.addEventListener('resize', rs);
            const cols = Math.floor(innerWidth / 18);
            const dr = Array(cols).fill(0).map(() => Math.random() * -60);
            function draw() {
                c.fillStyle = 'rgba(0,0,0,0.05)'; c.fillRect(0, 0, cv.width, cv.height);
                c.font = '11px "Share Tech Mono"';
                dr.forEach((y, i) => {
                    c.fillStyle = Math.random() > .97 ? '#00ff99' : '#001a0a';
                    c.fillText(Math.random() > .5 ? '1' : '0', i * 18, y * 18);
                    if (y * 18 > cv.height && Math.random() > .978) dr[i] = 0;
                    dr[i] += .35;
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();

        /* ── INIT ── */
        loadSkills();
    </script>
</body>
